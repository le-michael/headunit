name: PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Conventional Commits PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          title = os.environ.get("PR_TITLE", "")
          pattern = re.compile(
              r"\A(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)"
              r"(\([a-z0-9]([a-z0-9._/-]*[a-z0-9])?\))?!?: \S[^\r\n]*\Z"
          )
          if not pattern.fullmatch(title):
              print(
                  "::error::PR title must follow Conventional Commits: "
                  "<type>[optional (scope)][!]: <description>. "
                  "Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert. "
                  "Example: 'ci: add GitHub Actions workflows'.",
                  file=sys.stderr,
              )
              print(f"Received PR_TITLE={title!r}", file=sys.stderr)
              sys.exit(1)
          PY
